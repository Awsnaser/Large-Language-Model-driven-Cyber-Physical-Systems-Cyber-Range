[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cps-cyberrange"
version = "2.0.0"
description = "Safe LLM-driven cyber-physical security range and simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "docker>=7.1,<8", "prometheus-client>=0.19,<1", "numpy>=1.26,<3",
  "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4",
  "pandas>=2.1,<3", "faker>=24,<41", "tqdm>=4.66,<5", "pyyaml>=6.0,<7",
  "ollama>=0.4,<1", "requests>=2.31,<3", "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1", "structlog>=24,<26", "loguru>=0.7,<1"
]

[project.optional-dependencies]
neural = ["torch>=2.2,<3"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "black>=24,<26", "flake8>=7,<8"]

[project.scripts]
cps-cyberrange = "cyberrange:main"

[tool.setuptools]
py-modules = ["cyberrange", "multi_agent_system", "neural_agent_integration", "advanced_neural_architectures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
