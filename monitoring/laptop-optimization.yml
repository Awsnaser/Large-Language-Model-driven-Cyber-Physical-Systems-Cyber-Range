# Laptop-friendly, safe-by-default CPS range. Run from the repository root with:
# docker compose -f monitoring/laptop-optimization.yml up -d
# This intentionally keeps the same service and container names as the enhanced
# stack, but omits live packet capture and non-functional draft infrastructure.
services:
  gw_dmz_01:
    container_name: gw_dmz_01
    image: alpine:3.20
    command: ["sh", "-c", "apk add --no-cache openssh busybox-extras && ssh-keygen -A && adduser -D -s /bin/sh trainee && echo 'trainee:trainee' | chpasswd && /usr/sbin/sshd -D -e"]
    networks:
      dmz_net:
        aliases: ["gw_dmz_01"]
    ports:
      - "127.0.0.1:2222:22"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 8
    read_only: true
    tmpfs: [/run, /tmp]
    deploy:
      resources:
        limits: {memory: 128M, cpus: "0.25"}
    restart: unless-stopped

  hist_data_01:
    container_name: hist_data_01
    image: nginx:1.27-alpine
    networks:
      dmz_net:
        aliases: ["hist_data_01"]
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 8
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    deploy:
      resources:
        limits: {memory: 128M, cpus: "0.25"}
    restart: unless-stopped

  hmi_ops_01:
    container_name: hmi_ops_01
    image: alpine:3.20
    command: ["sh", "-c", "apk add --no-cache busybox-extras && sleep infinity"]
    networks:
      ot_net:
        aliases: ["hmi_ops_01"]
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -q sleep || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: {memory: 64M, cpus: "0.15"}
    restart: unless-stopped

  plc_industrial_01:
    container_name: plc_industrial_01
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /plc && echo 'SAFE_v2' > /plc/logic_hash && sleep infinity"]
    networks:
      ot_net:
        aliases: ["plc_industrial_01"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /plc/logic_hash || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 5
    volumes:
      - plc_state:/plc
    deploy:
      resources:
        limits: {memory: 64M, cpus: "0.15"}
    restart: unless-stopped

  prometheus:
    container_name: cps_prometheus
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=24h"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [monitoring_net]
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.25"}
    restart: unless-stopped

  grafana:
    container_name: cps_grafana
    image: grafana/grafana:11.2.0
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-sharing}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [monitoring_net]
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.25"}
    restart: unless-stopped

  # The laptop profile validates the same IDS configuration offline; it never
  # requests packet-capture capabilities. Use the enhanced profile, not this
  # file, if an isolated lab needs opt-in live capture.
  suricata-ids:
    container_name: cps_suricata_ids
    image: jasonish/suricata:7.0.11
    command: ["-T", "-c", "/etc/suricata/suricata.yaml"]
    volumes:
      - ../configs/suricata:/etc/suricata:ro
      - ../configs/suricata/logs:/var/log/suricata
    networks: [monitoring_net]
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.25"}
    restart: "no"

networks:
  dmz_net:
    driver: bridge
  ot_net:
    driver: bridge
  monitoring_net:
    driver: bridge

volumes:
  plc_state:
  prometheus_data:
  grafana_data:
