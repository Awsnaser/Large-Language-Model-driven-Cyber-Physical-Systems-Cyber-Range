# Standalone, safe monitoring stack. Run from the repository root with:
# docker compose -f monitoring/docker-compose.yml up -d
# Published dashboards are intentionally reachable only from this host.
services:
  prometheus:
    container_name: cps_prometheus
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [monitoring_net]

  grafana:
    container_name: cps_grafana
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-sharing}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [monitoring_net]

networks:
  monitoring_net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
